<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23ff6a1a%27/%3E%3C/svg%3E">
<title>FORGE — Workout Tracker</title>
<style>
:root{
  --bg:#0b0b0d; --bg2:#111114; --card:#17171b; --card2:#202026; --line:#2a2a31;
  --text:#f5f5f6; --mut:#9a9aa5; --dim:#6c6c76;
  --acc:#ff6a1a; --acc2:#ff8f45; --accsoft:rgba(255,106,26,.14); --ok:#3ddc84; --warn:#ffcc4d; --bad:#ff5a5a;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050506;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow-x:clip}
@media(min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(255,106,26,.07)}}
.screen{flex:1;padding:0 18px calc(112px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 0 4px}
.brand{font-weight:900;letter-spacing:.18em;font-size:15px}
.brand b{color:var(--acc)}
h1,h2,h3,p{margin:0}
.greet{font-size:26px;font-weight:800;line-height:1.15}
.sub{color:var(--mut);font-size:14px}
.icon{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.libc.on{border-color:rgba(255,106,26,.5)}
.libn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.mut{color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.acc{background:var(--accsoft);border-color:rgba(255,106,26,.4);color:var(--acc2)}
.chip.music{border-style:dashed;opacity:.85}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.btn{min-height:54px;border-radius:16px;padding:0 20px;font-weight:800;font-size:16px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#1a0a00;box-shadow:0 8px 24px rgba(255,106,26,.28)}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.ghost{border:1px solid rgba(255,106,26,.5);color:var(--acc2)}
.btn.danger{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.4);color:var(--bad)}
.btn.block{width:100%}
.btn:active,.icon:active,.pill:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;border:1px solid rgba(255,106,26,.35);background:radial-gradient(120% 90% at 100% 0%,rgba(255,106,26,.30),transparent 60%),linear-gradient(160deg,#1d1612,#111114 70%)}
.hero h2{font-size:34px;line-height:1;font-weight:900;letter-spacing:-.01em;margin:8px 0 14px;text-transform:uppercase}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stat{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:var(--mut);letter-spacing:.04em}
.blk{display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.blk .n{width:26px;height:26px;border-radius:8px;background:var(--accsoft);color:var(--acc2);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.blk .t{flex:1;min-width:0}
.blk .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t small{color:var(--dim);font-size:12px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-width:84px;min-height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:8px 12px;text-align:left}
.pill b{display:block;font-size:13px}
.pill span{font-size:11px;color:var(--mut);display:block;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.on{background:var(--accsoft);border-color:var(--acc)}
.pill.on b{color:var(--acc2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:52px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.seg.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.seg.g3 button{min-height:52px;font-size:16px}
.seg button.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc2)}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;box-sizing:border-box;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(11,11,13,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.nav button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.04em}
.nav button i{font-style:normal;font-size:20px;line-height:1}
.nav button.on{color:var(--acc)}
.nav button.navstart{position:relative;justify-content:flex-end;color:var(--acc);padding-bottom:3px}
.nav .navstart .sc{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#1a0a00;background:linear-gradient(180deg,var(--acc2),var(--acc));border:4px solid var(--bg);box-shadow:0 0 0 2px rgba(255,106,26,.55),0 8px 24px rgba(255,106,26,.5);transition:transform .12s}
.nav .navstart:active .sc{transform:translateX(-50%) scale(.94)}
.nav .navstart .sc svg{width:30px;height:30px;display:block}
.nav .navstart.on .sc{box-shadow:0 0 0 3px var(--acc2),0 8px 28px rgba(255,106,26,.7)}
.nav .navstart .sl{position:relative;font-size:11px;font-weight:800;letter-spacing:.06em}

/* import */
textarea{width:100%;min-height:210px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;resize:vertical;outline:none}
textarea:focus,input.txt:focus{border-color:var(--acc)}
input.txt{width:100%;min-height:48px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:0 14px;outline:none}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border:1.5px dashed rgba(255,106,26,.5);border-radius:18px;background:var(--accsoft);text-align:center;cursor:pointer}
.drop b{font-size:15px}
.drop small{color:var(--mut)}
.drop{position:relative;transition:background .12s,border-color .12s,transform .12s}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.drop:focus-within{border-color:var(--acc2)}
.drop.drag{background:rgba(255,106,26,.22);border-color:var(--acc2);border-style:solid;transform:scale(1.015)}
.drop.drag *{pointer-events:none}
.notice .nact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.notice .nact .btn{min-height:46px;height:auto;font-size:14px;line-height:1.25;padding:10px 14px;flex:1 1 100%;text-align:center}
.notice a.flink,.notice button.flink{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;touch-action:manipulation;padding:6px 0;display:inline-block}
.fbhint{font-size:12.5px;line-height:1.45;color:var(--mut)}
textarea.fbta{min-height:130px;font-family:inherit;font-size:16px;line-height:1.4}
input.txt.fb{font-size:16px}
.fbitem{padding:10px 0;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:10px;align-items:flex-start}
.fbitem .fbm{flex:1;min-width:0}
.fbitem .fbm small{display:block;color:var(--dim);font-size:11.5px}
.fbitem .fbm div{font-size:13.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fbstat{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.35);color:#a8f0c6;margin-top:12px}

.notice{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;background:rgba(255,204,77,.08);border:1px solid rgba(255,204,77,.35);color:#ffe3a0}
.notice.err{background:rgba(255,90,90,.08);border-color:rgba(255,90,90,.4);color:#ffb3b3}
.notice.ok{background:rgba(61,220,132,.08);border-color:rgba(61,220,132,.35);color:#a8f0c6}
pre.ex{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;line-height:1.5;color:var(--mut);overflow-x:auto;margin:8px 0 0;white-space:pre-wrap}
details summary{cursor:pointer;font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center}

/* program/history */
.dayhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.dayhead .dn{width:44px;height:44px;border-radius:14px;background:var(--accsoft);color:var(--acc2);font-weight:900;display:grid;place-items:center;flex:none}
.dayhead .tx{flex:1;min-width:0}
.dayhead .tx b{display:block;font-size:16px}
.dayhead .tx span{color:var(--mut);font-size:12.5px}
.caret{color:var(--dim);transition:transform .2s}
.open .caret{transform:rotate(90deg)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

/* active */
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 18px 6px}
.top .mid{flex:1;text-align:center;min-width:0}
.top .mid .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.progwrap{padding:4px 18px 0}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.cur{background:linear-gradient(170deg,#1c1713,#16161a 55%);border:1px solid rgba(255,106,26,.3)}
.cur h1{font-size:30px;line-height:1.08;font-weight:900;margin:8px 0 10px;letter-spacing:-.01em}
.dots{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:99px;background:var(--card2)}
.dots i.d{background:var(--acc)}
.dots i.s{background:var(--dim)}
.dots i.c{background:var(--text);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.setline{font-weight:800;font-size:14px;letter-spacing:.06em;color:var(--mut)}
.setline b{color:var(--text);font-size:15px}
.target{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px}
.target .big{font-size:64px;line-height:1;font-weight:900;color:var(--acc2);font-variant-numeric:tabular-nums}
.target .big.md{font-size:48px}.target .big.sm{font-size:34px}
.weekbar{display:flex;align-items:center;gap:10px}.wkt{flex:1;text-align:center}.wkt b{display:block;font-size:15px}.wkt span{font-size:12px;color:var(--mut)}
.guide p{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--mut)}.guide b{color:var(--text)}
.target .u{color:var(--mut);font-weight:700}
.note{font-size:12.5px;color:var(--dim);margin-top:2px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.field{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:center}
.field small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut);margin-bottom:2px}
.field .st{display:flex;align-items:center;justify-content:space-between;gap:4px}
.field .st button{width:44px;height:48px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.field input{width:100%;min-width:0;background:none;border:0;text-align:center;font-size:30px;font-weight:800;outline:none;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--dim)}
.next{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px}
.next .n{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:900;color:var(--acc2);flex:none}
.next b{display:block;font-size:15px}
.next span{color:var(--mut);font-size:12.5px}
.actions{position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,transparent,var(--bg) 28%);padding:18px 18px calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-top:auto}
.actions .btn{min-height:64px}
.actions .btn.pri{font-size:17px;white-space:nowrap;padding:0 8px}
.actions .sm{font-size:13px;flex-direction:column;gap:2px;font-weight:700;color:var(--mut)}
.actions .sm i{font-style:normal;font-size:18px}
.ringwrap{display:grid;place-items:center;position:relative;margin:6px 0 4px}
.ringwrap svg{transform:rotate(-90deg)}
.ringnum{position:absolute;text-align:center}
.ringnum b{font-size:72px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ringnum span{display:block;color:var(--mut);font-weight:700;letter-spacing:.14em;font-size:12px;margin-top:2px}

/* sheet */
.clockrow{display:flex;align-items:center;justify-content:center;gap:10px}
.pausebtn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--acc2);touch-action:manipulation;flex:none}
.pausebtn.on{background:var(--accsoft);border-color:rgba(255,106,26,.5)}
.pausedov{position:fixed;inset:0;z-index:55;background:rgba(8,8,10,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.pausedov .pi{font-size:54px;line-height:1}
.pausedov h2{margin:0;font-size:30px;letter-spacing:.14em;font-weight:900}
.pausedov .pc{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.pausedov .btn{width:100%;max-width:320px}
.chip.btnchip{touch-action:manipulation;cursor:pointer;color:var(--text)}
.chip.btnchip:active{transform:scale(.96)}
.moreblk{display:flex;width:100%;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px;text-align:left;color:inherit;touch-action:manipulation;cursor:pointer;align-items:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;justify-content:center;align-items:flex-end}
.sheet{width:100%;max-width:430px;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 20px)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.seqblock{margin-top:12px}
.seqblock .label{display:block;margin-bottom:6px}
.seqrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;width:100%;text-align:left;min-height:48px}
.seqrow.cur{background:var(--accsoft);border:1px solid rgba(255,106,26,.5)}
.seqrow .ix{width:24px;font-size:11px;color:var(--dim);font-weight:700}
.seqrow .nm{flex:1;min-width:0;font-size:14px;font-weight:600}
.seqrow .nm small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.seqrow .stt{font-size:14px;width:22px;text-align:center}
.seqrow.done .nm{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}

/* summary */
.trophy{width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,var(--acc2),var(--acc));display:grid;place-items:center;font-size:42px;margin:20px auto 6px;box-shadow:0 0 50px rgba(255,106,26,.45)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.tile b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{color:var(--mut);font-size:12px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
.exrow{padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow b{font-size:14px}
.exrow div{color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.5}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}

/* volume strip / weight lifted card */
.volstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px;margin-top:10px}
.volstrip>div{text-align:center;min-width:0;padding:0 4px;border-left:1px solid var(--line)}
.volstrip>div:first-child{border-left:0}
.volstrip small{display:block;color:var(--mut);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.volstrip b{display:block;font-size:22px;font-weight:900;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.volstrip b i{font-style:normal;font-size:11px;font-weight:700;color:var(--mut);margin-left:2px}
.volstrip em{display:block;font-style:normal;color:var(--mut);font-size:11.5px;margin-top:1px;font-variant-numeric:tabular-nums}
.volcard{padding:16px}
/* home dashboard (solo mode) */
.dsel{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.dsel button{min-height:44px;border-radius:999px;font-weight:800;font-size:15px;color:var(--mut);touch-action:manipulation}
.dsel button.on{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#1a0a00;box-shadow:0 4px 18px rgba(255,106,26,.35)}
.dring{position:relative;width:236px;height:236px;margin:2px auto 0;display:grid;place-items:center}
.dring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dring .trk{fill:none;stroke:rgba(255,255,255,.09);stroke-width:18}
.dring .arc{fill:none;stroke:url(#dgrad);stroke-width:18;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;filter:drop-shadow(0 0 10px rgba(255,106,26,.55));animation:dringdraw .9s cubic-bezier(.22,.8,.3,1) .05s backwards}
.dring .arc.ov{stroke:#ffd9a8;filter:drop-shadow(0 0 8px rgba(255,217,168,.55))}
.dring .tick{stroke:#fff;stroke-width:3;stroke-linecap:round}
@keyframes dringdraw{from{stroke-dashoffset:var(--from)}}
@media (prefers-reduced-motion:reduce){.dring .arc{animation:none}}
.dctr{position:relative;text-align:center;max-width:164px}
.dctr b{display:block;font-size:52px;font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dctr b.md{font-size:44px}.dctr b.sm{font-size:34px}
.dctr .u{display:block;margin-top:6px;color:var(--acc2);font-weight:800;font-size:15px}

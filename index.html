<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23ff6a1a%27/%3E%3C/svg%3E">
<title>FORGE — Workout Tracker</title>
<style>
:root{
  --bg:#0b0b0d; --bg2:#111114; --card:#17171b; --card2:#202026; --line:#2a2a31;
  --text:#f5f5f6; --mut:#9a9aa5; --dim:#6c6c76;
  --acc:#ff6a1a; --acc2:#ff8f45; --accsoft:rgba(255,106,26,.14); --ok:#3ddc84; --warn:#ffcc4d; --bad:#ff5a5a;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050506;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow-x:hidden}
@media(min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(255,106,26,.07)}}
.screen{flex:1;padding:0 18px 24px;display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 0 4px}
.brand{font-weight:900;letter-spacing:.18em;font-size:15px}
.brand b{color:var(--acc)}
h1,h2,h3,p{margin:0}
.greet{font-size:26px;font-weight:800;line-height:1.15}
.sub{color:var(--mut);font-size:14px}
.icon{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.mut{color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.acc{background:var(--accsoft);border-color:rgba(255,106,26,.4);color:var(--acc2)}
.chip.music{border-style:dashed;opacity:.85}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.btn{min-height:54px;border-radius:16px;padding:0 20px;font-weight:800;font-size:16px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#1a0a00;box-shadow:0 8px 24px rgba(255,106,26,.28)}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.ghost{border:1px solid rgba(255,106,26,.5);color:var(--acc2)}
.btn.danger{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.4);color:var(--bad)}
.btn.block{width:100%}
.btn:active,.icon:active,.pill:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;border:1px solid rgba(255,106,26,.35);background:radial-gradient(120% 90% at 100% 0%,rgba(255,106,26,.30),transparent 60%),linear-gradient(160deg,#1d1612,#111114 70%)}
.hero h2{font-size:34px;line-height:1;font-weight:900;letter-spacing:-.01em;margin:8px 0 14px;text-transform:uppercase}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stat{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:var(--mut);letter-spacing:.04em}
.blk{display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.blk .n{width:26px;height:26px;border-radius:8px;background:var(--accsoft);color:var(--acc2);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.blk .t{flex:1;min-width:0}
.blk .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t small{color:var(--dim);font-size:12px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-width:84px;min-height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:8px 12px;text-align:left}
.pill b{display:block;font-size:13px}
.pill span{font-size:11px;color:var(--mut);display:block;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.on{background:var(--accsoft);border-color:var(--acc)}
.pill.on b{color:var(--acc2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:52px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc2)}

/* nav */
.nav{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(11,11,13,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.nav button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.04em}
.nav button i{font-style:normal;font-size:20px;line-height:1}
.nav button.on{color:var(--acc)}

/* import */
textarea{width:100%;min-height:210px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;resize:vertical;outline:none}
textarea:focus,input.txt:focus{border-color:var(--acc)}
input.txt{width:100%;min-height:48px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:0 14px;outline:none}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border:1.5px dashed rgba(255,106,26,.5);border-radius:18px;background:var(--accsoft);text-align:center;cursor:pointer}
.drop b{font-size:15px}
.drop small{color:var(--mut)}
.notice{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;background:rgba(255,204,77,.08);border:1px solid rgba(255,204,77,.35);color:#ffe3a0}
.notice.err{background:rgba(255,90,90,.08);border-color:rgba(255,90,90,.4);color:#ffb3b3}
.notice.ok{background:rgba(61,220,132,.08);border-color:rgba(61,220,132,.35);color:#a8f0c6}
pre.ex{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;line-height:1.5;color:var(--mut);overflow-x:auto;margin:8px 0 0;white-space:pre-wrap}
details summary{cursor:pointer;font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center}

/* program/history */
.dayhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.dayhead .dn{width:44px;height:44px;border-radius:14px;background:var(--accsoft);color:var(--acc2);font-weight:900;display:grid;place-items:center;flex:none}
.dayhead .tx{flex:1;min-width:0}
.dayhead .tx b{display:block;font-size:16px}
.dayhead .tx span{color:var(--mut);font-size:12.5px}
.caret{color:var(--dim);transition:transform .2s}
.open .caret{transform:rotate(90deg)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

/* active */
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 18px 6px}
.top .mid{flex:1;text-align:center;min-width:0}
.top .mid .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.progwrap{padding:4px 18px 0}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.cur{background:linear-gradient(170deg,#1c1713,#16161a 55%);border:1px solid rgba(255,106,26,.3)}
.cur h1{font-size:30px;line-height:1.08;font-weight:900;margin:8px 0 10px;letter-spacing:-.01em}
.dots{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:99px;background:var(--card2)}
.dots i.d{background:var(--acc)}
.dots i.s{background:var(--dim)}
.dots i.c{background:var(--text);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.setline{font-weight:800;font-size:14px;letter-spacing:.06em;color:var(--mut)}
.setline b{color:var(--text);font-size:15px}
.target{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px}
.target .big{font-size:64px;line-height:1;font-weight:900;color:var(--acc2);font-variant-numeric:tabular-nums}
.target .big.md{font-size:48px}.target .big.sm{font-size:34px}
.weekbar{display:flex;align-items:center;gap:10px}.wkt{flex:1;text-align:center}.wkt b{display:block;font-size:15px}.wkt span{font-size:12px;color:var(--mut)}
.guide p{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--mut)}.guide b{color:var(--text)}
.target .u{color:var(--mut);font-weight:700}
.note{font-size:12.5px;color:var(--dim);margin-top:2px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.field{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:center}
.field small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut);margin-bottom:2px}
.field .st{display:flex;align-items:center;justify-content:space-between;gap:4px}
.field .st button{width:44px;height:48px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.field input{width:100%;min-width:0;background:none;border:0;text-align:center;font-size:30px;font-weight:800;outline:none;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--dim)}
.next{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px}
.next .n{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:900;color:var(--acc2);flex:none}
.next b{display:block;font-size:15px}
.next span{color:var(--mut);font-size:12.5px}
.actions{position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,transparent,var(--bg) 28%);padding:18px 18px calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-top:auto}
.actions .btn{min-height:64px}
.actions .btn.pri{font-size:17px;white-space:nowrap;padding:0 8px}
.actions .sm{font-size:13px;flex-direction:column;gap:2px;font-weight:700;color:var(--mut)}
.actions .sm i{font-style:normal;font-size:18px}
.ringwrap{display:grid;place-items:center;position:relative;margin:6px 0 4px}
.ringwrap svg{transform:rotate(-90deg)}
.ringnum{position:absolute;text-align:center}
.ringnum b{font-size:72px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ringnum span{display:block;color:var(--mut);font-weight:700;letter-spacing:.14em;font-size:12px;margin-top:2px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;justify-content:center;align-items:flex-end}
.sheet{width:100%;max-width:430px;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 20px)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.seqblock{margin-top:12px}
.seqblock .label{display:block;margin-bottom:6px}
.seqrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;width:100%;text-align:left;min-height:48px}
.seqrow.cur{background:var(--accsoft);border:1px solid rgba(255,106,26,.5)}
.seqrow .ix{width:24px;font-size:11px;color:var(--dim);font-weight:700}
.seqrow .nm{flex:1;min-width:0;font-size:14px;font-weight:600}
.seqrow .nm small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.seqrow .stt{font-size:14px;width:22px;text-align:center}
.seqrow.done .nm{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}

/* summary */
.trophy{width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,var(--acc2),var(--acc));display:grid;place-items:center;font-size:42px;margin:20px auto 6px;box-shadow:0 0 50px rgba(255,106,26,.45)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.tile b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{color:var(--mut);font-size:12px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
.exrow{padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow b{font-size:14px}
.exrow div{color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.5}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toastHost"></div>

<script>
'use strict';
/* =========================================================
   FORGE — single-file workout tracker prototype
   State lives in localStorage ("forge.v1"). No build step.
   ========================================================= */
const LS = 'forge.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Built-in program (hand-transcribed from the user's PDF; regenerate with tools/build_program.py) ---------- */
/*BUILTIN_START*/const BUILTIN_PROGRAM = {"name":"The Lost Breed - 8 Week Shred","ver":2,"source":"sample","author":"The Lost Breed (thelostbreed.com)","description":"Transcribed from \"New Shred Program.pdf\": 8 weeks / 4 phases, 6 training days per week with supersets, progression & drop sets and post-workout cardio circuits.","defaults":{"rest":45,"restMode":"round"},"guide":[{"t":"The plan","x":"8 weeks, 4 phases of 2 weeks. Mon Shoulders, Tue Arms, Wed Legs, Thu Chest, Fri Back, Sat Abs & Cardio, Sun rest. Every strength day ends with a post-workout cardio circuit. Intensity rises each phase."},{"t":"Supersets","x":"Exercises in one group alternate A → B (→ C) → A → B… Rest when the whole round is finished; push yourself not to rest during the superset."},{"t":"Rest","x":"Keep rest just long enough to recover for the target reps: 30-45 seconds. Cardio circuits: 1 minute after each A-B-C set."},{"t":"Progression sets","x":"Reps go down as weight goes up: aim to add 5-10 lb every set. If you miss the reps, rest the weight a few seconds and finish the set. Some sets keep the same reps but still ask for more weight each set."},{"t":"Drop-sets","x":"After heavy sets, drop the weight about 10-15 lb and go to failure. \"Double drop-set\" = repeat that twice back to back. A \"→\" in the reps (e.g. 20→8) means one set made of two weights."},{"t":"Reps notation","x":"\"10+10\" = two parts back to back in one set (e.g. wide grip then close grip). \"20 s\" = timed set. FAIL = to failure. Pick weights that let you fail at the suggested rep range, never sacrifice form."},{"t":"HIIT days","x":"The PDF names Tuesday and Thursday as HIIT days but only lists the post-workout cardio circuits - no separate HIIT workout - so none is scheduled here."},{"t":"Abs","x":"Do abs at least 3 times a week after training. Day 6 is a full abs circuit; the Program tab also has the PDF's 10 ab circuits to tack on."},{"t":"Session length","x":"Each workout should take at least 1 - 1.5 hours."}],   <div class="actions"><button class="btn sm" data-act="back" ${s.cur === 0 ? 'disabled' : ''}><i>‹</i>Back</button><button class="btn pri" data-act="complete">✓ COMPLETE SET</button><button class="btn sm" data-act="skip"><i>›</i>Skip</button></div>`;
}
function summaryView() {
  const h = S.history.find(x => x.id === S.lastSummaryId) || S.history[0];
  if (!h) return homeView();
  return `<div class="screen">
    <div class="trophy">🏆</div>
    <div style="text-align:center"><div class="greet">Workout complete!</div><div class="sub">${h.week ? esc(h.week) + ' · ' : ''}${esc(h.dayName)} — ${esc(h.focus)}</div></div>
    <div class="tiles">
      <div class="tile"><b>${fmt(h.durationSec)}</b><span>Total time</span></div>
      <div class="tile"><b>${h.setsDone}<small style="font-size:16px;color:var(--mut)">/${h.setsTotal}</small></b><span>Sets completed</span></div>
      <div class="tile"><b>${h.volume ? h.volume.toLocaleString() : '—'}</b><span>Volume (${h.unit})</span></div>
      <div class="tile"><b>${h.exercises.length}</b><span>Exercises</span></div>
    </div>
    ${!h.volume ? '<div class="note" style="text-align:center">Log weights during sets to see total volume.</div>' : ''}
    <div class="card"><div class="label" style="margin-bottom:6px">Sets logged</div>${h.exercises.map(e => `<div class="exrow"><b>${esc(e.name)}</b><div>${e.sets.map(setStr).join(' · ')}</div></div>`).join('')}</div>
    <div class="note" style="text-align:center">Saved to history. Next up: ${S.program.weeks.length > 1 ? esc(curWeek().name) + ' · ' : ''}${esc(dayOf().name)} — ${esc(dayOf().focus)}</div>
    <button class="btn pri block" data-act="doneSummary">Done</button>
    <button class="btn sec block" data-act="nav" data-v="history">View history</button>
  </div>`;
}
function modalHTML() {
  if (!modal) return '';
  const s = S.session;
  if (modal === 'seq' && s) {
    return `<div class="overlay" data-act="closeModal"><div class="sheet" id="sheet" data-stop="1"><div class="grab"></div><div class="row" style="justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2;padding:4px 0 8px"><b style="font-size:18px">Workout sequence</b><button class="icon" data-act="closeModal">✕</button></div><div class="sub" style="margin:4px 0 6px;font-size:13px">Tap any step to jump to it. Supersets alternate A → B → A → B.</div>
      ${s.day.blocks.map((b, bi) => `<div class="seqblock"><span class="label">${blockName(b, bi)}</span>${s.steps.map((st, i) => st.bi === bi ? i : -1).filter(i => i >= 0).map(i => {
        const st = s.steps[i], ex = stepEx(s, st), r = s.res[i] || {};
        return `<button class="seqrow ${i === s.cur ? 'cur' : ''} ${r.st === 'done' ? 'done' : ''}" data-act="jump" data-i="${i}"><span class="ix">${blockLabel(b, bi, st.ei)}</span><span class="nm">${esc(ex.name)}<small>Set ${st.si + 1}/${ex.sets.length} · ${tgtText(ex.sets[st.si])}${r.st === 'done' && r.w ? ' · ' + r.w + unit() + '×' + (r.r || '?') : ''}</small></span><span class="stt">${r.st === 'done' ? '✅' : r.st === 'skipped' ? '↷' : i === s.cur ? '🟠' : '○'}</span></button>`;
      }).join('')}</div>`).join('')}</div></div>`;
  }
  if (modal === 'exit' && s) {
    return `<div class="overlay" data-act="closeModal"><div class="sheet" data-stop="1"><div class="grab"></div><b style="font-size:20px">Leave workout?</b><div class="sub" style="margin:6px 0 16px">Your progress is saved — you can resume from Home.</div>
      <div style="display:grid;gap:10px"><button class="btn sec" data-act="closeModal">Keep going</button><button class="btn sec" data-act="homeKeep">Back to Home (keep workout running)</button><button class="btn pri" data-act="finishNow">Finish &amp; save now</button><button class="btn danger" data-act="discard">Discard workout</button></div></div></div>`;
  }
  if (modal === 'settings') {
    const st = S.settings;
    return `<div class="overlay" data-act="closeModal"><div class="sheet" data-stop="1"><div class="grab"></div><div class="row" style="justify-content:space-between"><b style="font-size:20px">Settings</b><button class="icon" data-act="closeModal">✕</button></div>
      <div style="margin-top:14px"><div class="sub" style="margin-bottom:6px">Rest timer</div><div class="seg">${[0, 30, 45, 60, 90, 120].map(n => `<button class="${st.rest === n ? 'on' : ''}" data-act="setRest" data-n="${n}">${n ? n + 's' : 'Off'}</button>`).join('')}</div></div>
      <div style="margin-top:14px"><div class="sub" style="margin-bottom:6px">Rest happens…</div><div class="seg"><button class="${st.restMode === 'set' ? 'on' : ''}" data-act="setMode" data-m="set">After every set</button><button class="${st.restMode === 'round' ? 'on' : ''}" data-act="setMode" data-m="round">After each superset round</button></div></div>
      <div style="margin-top:14px"><div class="sub" style="margin-bottom:6px">Units</div><div class="seg"><button class="${st.unit === 'lb' ? 'on' : ''}" data-act="setUnit" data-u="lb">lb</button><button class="${st.unit === 'kg' ? 'on' : ''}" data-act="setUnit" data-u="kg">kg</button></div></div>
      <div class="sw" style="margin-top:14px"><span>Keep screen awake during workouts</span><div class="seg"><button class="${st.wake ? 'on' : ''}" data-act="toggleWake">${st.wake ? 'On' : 'Off'}</button></div></div>
      <button class="btn danger block" style="margin-top:18px" data-act="resetAll">Reset all data</button></div></div>`;
  }
  return '';
}

/* ---------- Render ---------- */
function render() {
  const app = $('#app'); const sy = window.scrollY;
  let html;
  if (view === 'active' && S.session) html = activeView();
  else if (view === 'summary') html = summaryView();
  else if (view === 'program') html = programView();
  else if (view === 'import') html = importView();
  else if (view === 'history') html = historyView();
  else html = homeView();
  app.innerHTML = html + modalHTML();
  if (modal === 'seq') { const c = $('.seqrow.cur'); if (c) { const sh = $('#sheet'); sh.scrollTop = Math.max(0, c.offsetTop - sh.clientHeight / 2); } }
  const fi = $('#fileIn'); if (fi) fi.addEventListener('change', onFile);
  const ta = $('#importTA'); if (ta) ta.addEventListener('input', () => { importText = ta.value; });
  ['inW', 'inR'].forEach(id => { const el = $('#' + id); if (el) el.addEventListener('input', saveDraft); });
}
function onFile(e) {
  const f = e.target.files[0]; if (!f) return;
  importFile = f.name; importNote = null; parsed = null;
  if (/\.(pdf)$/i.test(f.name) || f.type === 'application/pdf' || f.type.startsWith('image/')) {
    importNote = `"${f.name}" is a ${f.type.startsWith('image/') ? 'photo/image' : 'PDF'}. Reading arbitrary PDFs and photos on-device isn't possible yet — AI-powered import is a later step. For now, paste the text into the box below, or load the built-in ${BUILTIN_PROGRAM.name} (already transcribed from your PDF).`;
    render(); return;
  }
  const rd = new FileReader();
  rd.onload = () => { importText = String(rd.result || ''); parsed = parseAny(importText); render(); toast('File loaded & parsed'); };
  rd.onerror = () => { importNote = 'Could not read that file.'; render(); };
  rd.readAsText(f);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.classList.contains('overlay') && e.target !== t) return; // clicks inside the sheet don't close
  act(t.dataset.act, t);
});
function act(a, t) {
  const s = S.session, d = t.dataset;
  switch (a) {
    case 'nav': modal = null; view = d.v; if (view === 'import' && !importText && !parsed) { } render(window.scrollTo(0, 0)); break;
    case 'pickDay': S.selDay = +d.i; save(); render(); break;
    case 'wk': { const n = S.selWeek + +d.d; if (n >= 0 && n < S.program.weeks.length) { S.selWeek = n; S.selDay = 0; save(); render(); } break; }
    case 'pwk': { const n = progWeek + +d.d; if (n >= 0 && n < S.program.weeks.length) { progWeek = n; openDay = null; render(); } break; }
    case 'tstart': startTimer(); break;
    case 'tstop': stopTimer(); break;
    case 'startAbs': startAbs(+d.i); break;
    case 'exportJSON': {
      const blob = new Blob([JSON.stringify(S.program, null, 1)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = (S.program.name || 'program').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Program JSON exported'); break;
    }
    case 'start': startWorkout(); break;
    case 'resume': view = 'active'; wake(true); render(window.scrollTo(0, 0)); break;
    case 'homeKeep': modal = null; view = 'home'; render(window.scrollTo(0, 0)); break;
    case 'discard': discard(); break;
    case 'complete': completeSet(); break;
    case 'back': backStep(); break;
    case 'skip': skipStep(); break;
    case 'exit': modal = 'exit'; render(); break;
    case 'seq': modal = 'seq'; render(); break;
    case 'closeModal': modal = null; render(); break;
    case 'jump': jumpTo(+d.i); break;
    case 'finishNow': finish(); break;
    case 'restAdd': if (s && s.phase === 'rest') { s.restEnd += +d.n * 1000; s.restTotal = Math.max(s.restTotal, Math.ceil((s.restEnd - Date.now()) / 1000)); if (s.restEnd <= Date.now()) endRest(); else { save(); render(); } } break;
    case 'wstep': case 'rstep': {
      const el = $(a === 'wstep' ? '#inW' : '#inR'); if (!el) break;
      let v = (parseFloat(el.value) || 0) + parseFloat(d.d); if (v < 0) v = 0;
      el.value = Math.round(v * 100) / 100 || ''; saveDraft(); break;
    }
    case 'settings': modal = 'settings'; render(); break;
    case 'setRest': S.settings.rest = +d.n; save(); render(); break;
    case 'setMode': S.settings.restMode = d.m; save(); render(); break;
    case 'setUnit': S.settings.unit = d.u; save(); render(); break;
    case 'toggleWake': S.settings.wake = !S.settings.wake; save(); render(); break;
    case 'resetAll': if (confirm('Erase all programs, history and settings on this device?')) { localStorage.removeItem(LS); S = freshState(); progWeek = null; view = 'home'; modal = null; parsed = null; importText = ''; render(); toast('Reset'); } break;
    case 'openDay': openDay = openDay === +d.i ? null : +d.i; render(); break;
    case 'doDay': S.selWeek = progWeek == null ? S.selWeek : progWeek; S.selDay = +d.i; save(); view = 'home'; render(window.scrollTo(0, 0)); toast(curWeek().name + ' · ' + dayOf().name + ' set as today'); break;
    case 'histToggle': openHist = openHist === d.id ? null : d.id; render(); break;
    case 'doneSummary': view = 'home'; render(window.scrollTo(0, 0)); break;
    case 'parse': { const ta = $('#importTA'); if (ta) importText = ta.value; parsed = parseAny(importText); importNote = null; render(); setTimeout(() => { const c = $('.notice.ok, .notice.err'); }, 0); break; }
    case 'clearImport': importText = ''; importFile = ''; importNote = null; parsed = null; importName = ''; render(); break;
    case 'loadSample': {
      const p = builtin(), d = p.defaults || {};
      S.program = p; S.selWeek = 0; S.selDay = 0; S.session = null; progWeek = null; openDay = null;
      if (d.rest != null) S.settings.rest = d.rest; if (d.restMode) S.settings.restMode = d.restMode;
      save(); view = 'home'; render(window.scrollTo(0, 0)); toast(p.name + ' loaded'); break;
    }
    case 'useParsed': {
      if (!parsed || !allDays(parsed.program).length) break;
      const nm = ($('#progName') || {}).value; const p = parsed.program; p.name = (nm || p.name || 'My program').trim(); p.source = 'import';
      S.program = p; S.selWeek = 0; S.selDay = 0; S.session = null; progWeek = null; openDay = null; save(); view = 'home'; parsed = null; render(window.scrollTo(0, 0)); toast('Program saved'); break;
    }
  }
}
// ticker: running clock + rest countdown (no full re-render so inputs keep focus)
setInterval(() => {
  const s = S.session; if (!s || view !== 'active') return;
  const el = $('#tElapsed'); if (el) el.textContent = fmt((Date.now() - s.startedAt) / 1000);
  if (s.phase === 'rest') {
    const rem = Math.max(0, Math.ceil((s.restEnd - Date.now()) / 1000));
    const rn = $('#restNum'); if (rn) rn.textContent = rem;
    const ring = $('#ring'); if (ring) { const C = 2 * Math.PI * 92; ring.setAttribute('stroke-dashoffset', C * (1 - rem / s.restTotal)); }
    if (Date.now() >= s.restEnd) endRest();
  } else if (s.phase === 'work' && s.tmr) {
    const now = Date.now(), tm = s.tmr, n = $('#tmrNum'), u = $('#tmrU');
    if (now >= tm.end) return timerDone();
    if (n) n.textContent = now < tm.start ? Math.ceil((tm.start - now) / 1000) : Math.max(0, Math.ceil((tm.end - now) / 1000));
    if (u) u.textContent = now < tm.start ? 'get ready' : 'seconds left — go!';
  }
}, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.session && S.session.phase === 'work') wake(true); });
render();
// test hooks (harmless in production)
window.__forge = { parseText, parseAny, buildSteps, getState: () => S, BUILTIN_PROGRAM, builtin, estSec };
</script>
</body>
</html>
